[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

markers =
    live: llama a la API real y CONSUME CUOTA. Solo corre con: pytest --live
    gui: abre una ventana Tk de verdad (se salta solo si no hay escritorio)

# Los tests marcados `live` se saltan salvo que se pase --live (ver conftest.py).
# Ademas, cualquier test NO marcado `live` tiene la red bloqueada: si intenta
# salir a internet, falla en vez de gastar cuota en silencio.
